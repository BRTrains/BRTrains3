grf:
  grfid: BRT3
  short_name: BRTrains3
  name: BRTrains 3
  description: UK railway vehicles for OpenTTD

versioning:
  version: 1
  compatible_version: 1

# The purchase list is ordered by BRBuild: everything else by introduction date,
# then the Class grouping, then coaches, then wagons (see BRBuild's docs/project.md).
purchase_list:
  order: grouped

params:
  - identifier: param_speed_mode
    name_str: Speed Mode
    desc_str: Use each unit's design speed, or its permitted service speed
    min_value: 0
    max_value: 1
    def_value: 1
    names:
      0: Service Speed
      1: Design Speed

  - identifier: param_capacity_scaling
    name_str: Capacity Scaling
    desc_str: Scale vehicle capacities
    min_value: 1
    max_value: 1
    def_value: 1
    names:
      1: 1x

  - identifier: param_disable_default_vehicles
    name_str: Hide Default OpenTTD vehicles?
    desc_str: Hide the default OpenTTD vehicles from the vehicle list
    min_value: 0
    max_value: 1
    def_value: 1
    names:
      0: Show Default OpenTTD vehicles
      1: Hide Default OpenTTD vehicles

global_vehicle_switches: []

global_actions:
  - condition: param_disable_default_vehicles == 1
    action: disable_item(FEAT_TRAINS)
