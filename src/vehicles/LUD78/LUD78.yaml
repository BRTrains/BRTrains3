model_life: 0

info:
  identifier: lud78
  name: 'London Underground D78 Stock'

stats:
  vehicle_type: train
  train_type: multiple_unit
  # The legacy root item (`BRTrains2/src/trains/metro/LUSubsurface/LUD78.pnml`, `item_LUDStock`
  # 496) carries the whole-unit power and weight for the three-car formation; its two
  # articulated parts (`item_LUDStockb` 497 / `_c` 498) declare 0 hp and 0 t. BRBuild has one
  # item per candidate, so the root item's figures are copied as-is, like the other MU and
  # London Underground conversions. The 3000 hp root figure is the suburban-stock boilerplate
  # the A60/A62 and C69/C77 legacy files also carry; the 150 t is low for a three-car D Stock
  # (about 50 t per car) - both recorded as queries in the import oddities file.
  weight: 150
  length: 8
  power: 3000
  speed: 45
  tractive_effort: 0.08
  power_type:
    - electric
  track_type:
    - FOURTH

cargo: passenger

# The legacy root item declares both; the two articulated items declare only the loading
# speed. No `cargo_age_period` is declared anywhere in the file, so none was invented.
loading_speed: 40

dates:
  introduction_date: 1978-04-21

profiles:
  - identifier: DEFAULT
    num_vehicles: 3
    capacity: 205
    sprite_override: [1, 2, 3]
    special_tags:
      - formation/3-car

liveries:
  # Order is the legacy `sw_LUDStock_cargo_subtype_text` order (0 then 1), which is also the
  # composite's row order (`BRTrains3-artwork-tools/repacked/LU_D78.png`, packed 0/25/50 then
  # 375/400/425): 0 = `spriteset_LUDStock{a,b,c}_TfL`, 1 =
  # `spriteset_LUDStock{a,b,c}_TfLPrefurb`.
  - name: 'London Underground'
    special_tags: [operator/London Underground]
  - name: 'London Underground - Pre-Refurbishment'
    special_tags: [operator/London Underground]
