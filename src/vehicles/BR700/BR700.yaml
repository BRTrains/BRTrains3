info:
  identifier: br_700
  name: 'Class 700 "Desiro City"'

stats:
  vehicle_type: train
  train_type: multiple_unit
  length: 8
  tractive_effort: 0.15
  power_type:
    - electric
  # Both legacy items declare `track_type: [THIRD, ELRL]` — the dual-voltage Desiro City
  # sets, so the logical type is stated rather than left to the classifier's `power_type`
  # default (which would give this unit `ELRL` alone).
  track_type:
    - THIRD
    - ELRL

cargo: passenger

dates:
  introduction_date: 2015-04-21

profiles:
  - identifier: 'br_700_12'
    name: '12-Car'
    num_vehicles: 12
    speed: 100
    power: 6705
    weight: 451
    # `item_BR700_2` carries `cargo_capacity: 83` as a property and the callback
    # `return(83 * param_pax)` — already per-part, so 996 in game. The three articulated
    # items state 53 each (`return(53 * param_pax)`), which BRBuild's single-item callback
    # cannot express per part — a query.
    capacity: 83
    sprite_override: [1, 2, 4, 4, 4, 4, 4, 4, 4, 4, 3]
    special_tags:
      - formation/12-car

  - identifier: 'br_700_8'
    name: '8-Car'
    num_vehicles: 8
    speed: 100
    power: 4425
    weight: 306
    capacity: 56
    sprite_group: 'br_700_12'
    sprite_override: [1, 2, 4, 4, 4, 4, 4, 3]
    special_tags:
      - formation/8-car

liveries:
  - name: 'Govia Thameslink'
    special_tags: [operator/Govia Thameslink]
  - name: 'Govia Thameslink Pride'
    special_tags: [operator/Govia Thameslink]
