info:
  identifier: br_319
  name: 'Class 319'
  sub_name: Electric multiple unit
  based_on: British Rail Class 319

stats:
  vehicle_type: train
  train_type: multiple_unit
  speed: 100
  length: 8
  tractive_effort: 0.08
  power: 1438
  weight: 168
  # The legacy item declares track_type [THIRD, ELRL] (dual voltage).
  track_type:
    - THIRD
    - ELRL
  power_type:
    - electric

cargo: passenger

loading_speed: 25

dates:
  introduction_date: 1987-04-21

profiles:
  # One 4-car unit: `switch_articulated_BR319` adds items 249/250/251 as parts 1..3, and
  # those items' own `default:` switches are sw_BR319b/c/d while item 248 uses sw_BR319a,
  # so the articulated positions consume the sheet group's a, b, c, d blocks in order and
  # no sprite_override is needed (BR319.pnml; corrected 2026-09-26 from the PNML rather
  # than inferred from the artwork).
  - identifier: '319_4'
    name: 4-Car
    num_vehicles: 4
    capacity: 80
    special_tags:
      - formation/4-car
      - subclass/319

liveries:
  # Sheet group order = sw_BR319a..d's cargo_subtype order (0..8) = the order
  # compose_br319_sheet.py packs, because BRBuild consumes rows sequentially. Names expand
  # the legacy subtype_text strings; sheet block y values are in the compositor (and come
  # from BR319.pnml's own spriteset declarations).
  - name: 'Network South East'
    special_tags: [operator/Network SouthEast]
  - name: 'BR Thameslink'
    special_tags: [operator/Thameslink]
  - name: 'Connex'
    special_tags: [operator/Connex South Central]
  - name: 'First Capital Connect Urban Lights'
    special_tags: [operator/First Capital Connect]
  - name: 'Govia Thameslink Pink'
    special_tags: [operator/Govia Thameslink]
  - name: 'Govia Thameslink Blue'
    special_tags: [operator/Govia Thameslink]
  - name: 'Southern'
    special_tags: [operator/Southern]
  - name: 'Northern'
    special_tags: [operator/Northern]
  - name: 'London Midland'
    special_tags: [operator/London Midland]
