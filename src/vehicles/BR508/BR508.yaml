info:
  identifier: br_508
  name: 'Class 508'

stats:
  vehicle_type: train
  train_type: multiple_unit
  power: 880
  speed: 75
  length: 8
  tractive_effort: 0.07
  power_type:
    - electric
  track_type:
    - THIRD

cargo: passenger

loading_speed: 25
cargo_age_period: 185

dates:
  introduction_date: 1978-04-21

profiles:
  - identifier: '508_0'
    num_vehicles: 4
    # `item_BR508_1`'s callback is `return(74 * param_pax)` with no division (its own property
    # also reads 74), so 74 is the per-car figure; the two trailer items declare 82. The
    # legacy 4-car seats 74 + 82 + 82 + 74 = 312, this import reads 296 -- a query.
    capacity: 74
    weight: 125
    sprite_override: [1, 3, 3, 2]
    special_tags:
      - formation/4-car

  - identifier: '508_1'
    num_vehicles: 3
    capacity: 74
    weight: 98
    sprite_override: [1, 3, 2]
    special_tags:
      - formation/3-car

# Names from BRTrains2's `sw_BR508_cargo_subtype_text` (subtype order 0..7) expanded through
# `lang/partial/livery_prebuilt_strings.plng`: `str_BRBlue` "(BR - Blue)",
# `str_MerseyRailOld` "(MerseyRail - Old)", `str_Silverlink` "(Silverlink)",
# `str_Connex` "(Connex)", `str_Southeastern_yellow` "(Southeastern - Yellow)",
# `str_Southeastern_blue` "(Southeastern - Blue)", `str_MerseyRail` "(MerseyRail)",
# `str_MerseyRailGoodComs` "(MerseyRail - Good Communications)". That order is the YAML livery
# order and the order the composite packs its a/b/c row triples in.
#
# The class's own summary text (`str_BR508_liveries`) instead lists "Southeastern Yellow
# Stripe" and "Southeastern Blue Stripe" where subtypes 2 and 3 are Silverlink and Connex --
# that list looks copied from the Class 465/466 text, and the sheet carries real Silverlink
# and Connex bands, so the switch (and the spriteset names `spriteset_BR508*_Silverlink`,
# `spriteset_BR508*_CSE`) is followed. Recorded as a query in the oddities file.
#
# BR Blue applies to both profiles (the 508/0's own livery switch names it); the other seven
# belong to the 508/1 alone and are restricted, because an unrestricted livery is allocated
# to every profile and the sheet holds one group each.
liveries:
  - name: 'BR Blue'
    special_tags: [operator/BR]
  - name: 'Merseyrail - Old'
    profiles: ['508_1']
    special_tags: [operator/Merseyrail]
  - name: 'Silverlink'
    profiles: ['508_1']
    special_tags: [operator/Silverlink]
  - name: 'Connex'
    profiles: ['508_1']
    special_tags: [operator/Connex]
  - name: 'Southeastern - Yellow'
    profiles: ['508_1']
    special_tags: [operator/Southeastern]
  - name: 'Southeastern - Blue'
    profiles: ['508_1']
    special_tags: [operator/Southeastern]
  - name: 'Merseyrail'
    profiles: ['508_1']
    special_tags: [operator/Merseyrail]
  - name: 'Merseyrail - Good Communications'
    profiles: ['508_1']
    special_tags: [operator/Merseyrail]
