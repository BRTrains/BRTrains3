

info:
  identifier: br_320
  name: 'Class 320/3'
  sub_name: Electric multiple unit
  based_on: British Rail Class 320/3

stats:
  vehicle_type: train
  train_type: multiple_unit
  weight: 114
  length: 8
  power: 1328
  # The 320/3s were built to 75 mph (hence no yaw dampers); dampers were fitted
  # across the class in 2010, clearing them for 90 mph in service. The design speed
  # is 90 either way, so the split is the service limit: 75 before the dampers, 90
  # after. Both figures belong to a profile rather than to the vehicle.
  tractive_effort: 0.3
  power_type:
    - electric

cargo: passenger

dates:
  introduction_date: 1990-08-01

profiles:
  - identifier: 320_3_pre2010
    name: 3-Car (75 mph)
    introduction_date: 1990-08-01
    sprite_group: 320_3_pre2010 # the two profiles share one set of drawings
    # The sheet holds one four-row block per livery - front, rear, an unused plain
    # middle car, then the pantograph middle - so a 3-car unit needs rows 1, 4, 2 in
    # that order (front, middle, rear as the legacy articulated switch ordered them).
    # group_size becomes 4, which consumes the block exactly and skips the unused row.
    sprite_override: [1, 4, 2]
    num_vehicles: 3
    capacity: 71
    speed: 75
    design_speed: 90
    special_tags:
      - formation/3-car
      - subclass/320_3_pre2010
  - identifier: 320_3_post2010
    name: 3-Car (90 mph)
    introduction_date: 2010-01-01
    sprite_group: 320_3_pre2010
    sprite_override: [1, 4, 2]
    num_vehicles: 3
    capacity: 71
    speed: 90
    design_speed: 90
    special_tags:
      - formation/3-car
      - subclass/320_3_post2010

liveries:
  # Liveries are consumed in sheet order: the sheet's blocks are Saltire, Carmine,
  # Orange. The purchase list sorts by name, so this order is only about the sheet.
  - name: 'ScotRail Saltire'
    special_tags: [operator/ScotRail]
  - name: 'Strathclyde PTE Carmine & Cream'
    special_tags: [operator/Strathclyde PTE]
  - name: 'Strathclyde PTE Orange'
    special_tags: [operator/Strathclyde PTE]
