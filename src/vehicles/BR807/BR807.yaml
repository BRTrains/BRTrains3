info:
  identifier: br_807
  # The legacy `item_BR807_7car` (580) is the only 807 item, so the candidate is named for
  # the class and the single formation is a profile, as for the Class 801/745.
  name: 'Class 807'

stats:
  vehicle_type: train
  train_type: multiple_unit
  length: 8
  speed: 125
  # `switch_BR800_speed` (`BRTrains2/src/trains/electric_mu/sprites/800.pnml`, shared by the
  # whole IEP family): `param_max_speed` 0 gives 201 field units and 1 gives 225 — 125 mph
  # service and 140 mph design, the same pair the Class 800/801/802/805 carry.
  design_speed: 140
  tractive_effort: 0.3
  power_type:
    - electric
  track_type:
    - ELRL

cargo: passenger

dates:
  introduction_date: 2018-08-18

profiles:
  - identifier: DEFAULT
    name: 7-Car
    num_vehicles: 7
    power: 4848
    weight: 357
    # `item_BR807_7car`'s callback is `return(453/7 * param_pax)`, already the per-part figure
    # (453/7 = 64 in NML's integer division; BRBuild multiplies by the part count, so a 7-car
    # reads 448 in game where the source's numerator implies 453). See the oddities entry.
    capacity: 64
    # `switch_BR807_7car_spriteset_Avanti` draws `position_in_articulated_veh % 7`: 0 = front,
    # 1 = middle3, 2 = middle2, 3 = middle, 4 = middle3, 5 = middle2, 6 = rear. The values are
    # the five drawings the livery's row group holds, packed in this order.
    special_tags:
      - formation/7-car

liveries:
  # `switch_BR807_7car_subtype_text` order: 0 = `str_AvantiWestCoast` "(Avanti West Coast)",
  # 1 = `str_HitachiWhite` "(Hitachi - White)".
  - name: 'Avanti West Coast'
    sprite_override: [1, 2, 3, 4, 2, 3, 5]
    special_tags: [operator/Avanti West Coast]

  # The white scheme is the unit's own as delivered by Hitachi, not an operator livery.
  - name: 'Hitachi - White'
    # `switch_BR807_7car_spriteset_Hitachi`: 0 = front, 6 = rear, every other car the middle.
    sprite_override: [1, 2, 2, 2, 2, 2, 3]
    special_tags: [operator/Hitachi]
