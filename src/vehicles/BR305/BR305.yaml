profiles:
  # `item_BR305_1` 20: a three-car unit, 800 hp / 118 t. `switch_articulated_BR305_1` adds
  # one part at offset 1 and one at 2, and its `default:` is `sw_BR305_1_a`, so the formation
  # reads the group's declared a, b, c rows in order.
  #
  # Capacity is per part, as BRBuild's callback attaches to the item every articulated part
  # references. The legacy's three items carry 94 (driving car), 84 and 94, and the callback
  # `return(94 * param_pax)` on the driving car / `return(84 ...)` / `return(94 ...)` matches
  # them: one uniform per-part figure cannot express three different ones, so the driving
  # car's declared 94 is used and the trailers' figures are recorded in the oddities file.
  - identifier: '305_1'
    name: '305/1'
    num_vehicles: 3
    capacity: 94
    power: 800
    weight: 118
    special_tags:
      - formation/3-car

  - identifier: '305_2'
    name: '305/2'
    num_vehicles: 4
    capacity: 80
    power: 800
    weight: 149
    special_tags:
      - formation/4-car

