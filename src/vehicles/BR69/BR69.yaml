info:
  identifier: br_69
  name: 'Class 69'
  sub_name: Heavy freight diesel locomotive
  based_on: British Rail Class 69

# One candidate, one 1-car profile: the legacy set files the class as a single item
# (`item_BR69` 736, BRTrains2/src/trains/diesel_loco/69.pnml) with no articulated
# callback, drawing all eleven of its liveries from `gfx/Diesel/69.png`.
stats:
  vehicle_type: train
  train_type: locomotive
  weight: 130
  length: 8
  power: 3200
  speed: 80
  # The legacy item carries `tractive_effort_coefficient: 0.323`; below 1 BRBuild
  # reads the figure as a coefficient already, so it is carried unchanged.
  tractive_effort: 0.323
  power_type:
    - diesel

# The legacy item declares `refittable_cargo_classes: 0` and a zero-returning
# cargo-capacity callback, so `cargo: none` states the effective behaviour.
cargo: none
loading_speed: 3

dates:
  introduction_date: 2020-04-01

profiles:
  - identifier: DEFAULT
    num_vehicles: 1
    capacity: 0
    special_tags:
      - formation/1-car
      - subclass/69

liveries:
  # Ordered by the legacy `sw_BR69` cargo-subtype switch (0..10) and named from its
  # `sw_BR69_cargo_subtype_text` partner, with the surrounding parentheses dropped.
  # That order is also the composite's row order (compose_br69_sheet.py), which packs
  # the source bands y = 0, 26, ... 260 in exactly the same sequence.
  - name: 'GBRf Blue and Orange'
    special_tags: [operator/GB Railfreight]
  # The BR-era corporate liveries are heritage repaints on GBRf's own locomotives, so
  # they carry the operating organisation and the livery's own name (see the oddities
  # file for the badge judgement call).
  - name: 'BR Green'
    special_tags: [operator/GB Railfreight, operator/BR]
  - name: 'BR Maroon'
    special_tags: [operator/GB Railfreight, operator/BR]
  - name: 'BR Blue'
    special_tags: [operator/GB Railfreight, operator/BR]
  - name: 'BR Large Logo'
    special_tags: [operator/GB Railfreight, operator/BR]
  - name: 'BR Research Department'
    special_tags: [operator/GB Railfreight, operator/BR]
  - name: 'GBRf Andys Man Club'
    special_tags: [operator/GB Railfreight]
  - name: 'GBRf British Transport Police'
    special_tags: [operator/GB Railfreight]
  - name: 'GBRf Kestrel Tribute'
    special_tags: [operator/GB Railfreight]
  - name: 'GBRf 2 Tone Green'
    special_tags: [operator/GB Railfreight]
  - name: 'GBRf Railfreight Grey'
    special_tags: [operator/GB Railfreight]
