
special_tags:
  - subclass/lnwr_webb

info:
  identifier: lnwr_webb
  name: 'LNWR Webb Coal Tank 0-6-2T'
  sub_name: Steam locomotive
  based_on: LNWR Webb Coal Tank

stats:
  vehicle_type: train
  train_type: locomotive
  weight: 44.5
  length: 6
  power: 650
  speed: 45
  tractive_effort: 0.165
  power_type:
    - steam
  # `item_LNWRWebb` (BRTrains2/src/trains/steam_loco/LNWR/LNWRWebb.pnml, 554) declares
  # `track_type: RAIL`, which is what the classifier emits for self-powered stock, so it is
  # left unset here as on the other steam locomotives of the set (LMS8F, GERL77, P2).

cargo: none

dates:
  introduction_date: 1881-01-01

profiles:
  # A single-part tank engine: `item_LNWRWebb` has no `articulated_part` callback, so the
  # consist is one vehicle and each (profile, livery) group consumes one sheet row.
  - identifier: DEFAULT
    num_vehicles: 1
    capacity: 0
    special_tags:
      - formation/1-car

liveries:
  # Ordered by `sw_LNWRWebb` (cargo_subtype 0..1), not by spriteset declaration or source y:
  # subtype 0 is `spriteset_LNWRWebb_LNWRBlack` at template_train24px(0, 35) and subtype 1 is
  # `spriteset_LNWRWebb_BRBlack` at template_train24px(0, 13). The composite
  # (BRTrains3-artwork-tools/compose_lnwr_webb_sheet.py) packs the rows in this order.
  - name: 'LNWR Black'
    special_tags: [operator/LNWR]
  - name: 'BR Black'
    special_tags: [operator/BR]
