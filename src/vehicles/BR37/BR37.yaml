# Ordered by BRTrains2's `switch(FEAT_TRAINS, SELF, sw_BR37, cargo_subtype)` (0..33),
# whose `sw_BR37_cargo_subtype_text` names each subtype. Every subtype has its own
# spriteset on gfx/BR37.png, so the sheet holds one band per livery and
# compose_br37_sheet.py re-stacks them in this order. Livery wording follows the
# legacy's `str_*` strings; the bands' own pixels corroborate every declared identity
# (see probe_br37_bands.py / probe_saturated_colours.py).
