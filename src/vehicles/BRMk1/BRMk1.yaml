info:
  identifier: br_mk1
  name: 'Mk1 Coach'
  sub_name: Passenger coach
  based_on: British Rail Mk1

stats:
  vehicle_type: train
  train_type: coach
  weight: 41
  length: 8
  power: 0
  speed: 90
  tractive_effort: 0

cargo: passenger
loading_speed: 10

dates:
  introduction_date: 1952-04-21

profiles:
  # One profile per Mk1 coach type. Each type has its own band of the five per-livery
  # sheets the legacy draws the family from (`BRTrains2/gfx/Rolling Stock/Mk1/`), so each
  # type keeps a sheet of its own: `BRMk1.png` holds the Tourist Standard Open's five
  # bands (source band y=0 of Mk1_CarmineCream.png, Mk1_ChocolateCream.png,
  # Mk1_MalachiteGreen.png, Mk1_BRMaroon.png and Mk1_BRBlue.png), composed by
  # `BRTrains3-artwork-tools/compose_br_mk1_sheet.py`. A later Mk1 type is a second
  # profile with its own `spritesheet`, as on the Mk3.
  - identifier: tso
    name: 'Tourist Standard Open'
    num_vehicles: 1
    capacity: 64
    introduction_date: 1952-04-21
    special_tags:
      - formation/1-car
      - subclass/mk1_tso

  # The Restaurant Buffet reads its own band of those same five sheets - y=234 of
  # `Mk1_<Livery>.png`, per `spriteset_BRMk1RMB_*` in BRTrains2
  # `src/trains/rolling_stock/BR/Mk1/sprites/Mk1RMB.pnml` - so it keeps a sheet of its own,
  # `BRMk1RMB.png`, composed by `BRTrains3-artwork-tools/compose_br_mk1_rmb_sheet.py`.
  - identifier: rmb
    name: 'Restaurant Buffet'
    num_vehicles: 1
    capacity: 44
    weight: 35
    introduction_date: 1957-04-21
    spritesheet: BRMk1RMB.png
    special_tags:
      - formation/1-car
      - subclass/mk1_rmb

  # The Brake Standard Corridor reads y=104 of those same five sheets, per the
  # `spriteset_BRMk1BSK_*` declarations in BRTrains2
  # `src/trains/rolling_stock/BR/Mk1/sprites/Mk1BSK.pnml`, so it keeps a sheet of its own,
  # `BRMk1BSK.png`, composed by `BRTrains3-artwork-tools/compose_br_mk1_type_sheet.py 104`.
  # The same band is read by the BSO and BSOT in the legacy (query on the type's own entry).
  - identifier: bsk
    name: 'Brake Standard Corridor'
    num_vehicles: 1
    capacity: 32
    weight: 36
    introduction_date: 1951-04-21
    spritesheet: BRMk1BSK.png
    special_tags:
      - formation/1-car
      - subclass/mk1_bsk

  # The Brake Standard Open reads the same y=104 family band as BSK/BSOT. Reuse
  # the BSK rows; the legacy item differs in capacity, weight and introduction date.
  - identifier: bso
    name: 'Brake Standard Open'
    num_vehicles: 1
    capacity: 39
    weight: 34
    introduction_date: 1955-04-21
    sprite_group: 'bsk'
    special_tags:
      - formation/1-car
      - subclass/mk1_bso

  # The Brake Standard Open Mini-Buffet reads the same y=104 family band as BSK/BSO.
  # Reuse the BSK rows; the legacy item differs in capacity, weight and introduction date.
  - identifier: bsot
    name: 'Brake Standard Open Mini-Buffet'
    num_vehicles: 1
    capacity: 31
    weight: 35
    introduction_date: 1952-04-21
    sprite_group: 'bsk'
    special_tags:
      - formation/1-car
      - subclass/mk1_bsot

  # The Composite Corridor reads y=78 of the five per-livery family sheets, per
  # `spriteset_BRMk1CK_*` in BRTrains2/src/trains/rolling_stock/BR/Mk1/sprites/Mk1CK.pnml.
  - identifier: ck
    name: 'Composite Corridor'
    num_vehicles: 1
    capacity: 48
    weight: 32
    introduction_date: 1952-04-21
    spritesheet: BRMk1CK.png
    special_tags:
      - formation/1-car
      - subclass/mk1_ck

  # The First Open reads y=26 of the five per-livery family sheets, per
  # `spriteset_BRMk1FO_*` in BRTrains2
  # `src/trains/rolling_stock/BR/Mk1/sprites/Mk1FO.pnml`, so it keeps a sheet of its own,
  # `BRMk1FO.png`, composed by `BRTrains3-artwork-tools/compose_br_mk1_type_sheet.py 26`.
  # y=26 is read by no other Mk1 type (only SO/TSO/SK share y=0).
  - identifier: fo
    name: 'First Open'
    num_vehicles: 1
    capacity: 42
    weight: 33
    introduction_date: 1951-04-21
    spritesheet: BRMk1FO.png
    special_tags:
      - formation/1-car
      - subclass/mk1_fo

  # The First Corridor reads y=52 of the five per-livery family sheets, per
  # `spriteset_BRMk1FK_*` in BRTrains2
  # `src/trains/rolling_stock/BR/Mk1/sprites/Mk1FK.pnml` (all five at
  # `template_train32px(0, 52)`; the switch `sw_BRMk1FK` reads them in the shared
  # `sw_BRMk1_cargo_subtype_text` order 0..4), so it keeps a sheet of its own,
  # `BRMk1FK.png`, composed by `BRTrains3-artwork-tools/compose_br_mk1_type_sheet.py 52`.
  # y=52 is read by no other Mk1 type.
  - identifier: fk
    name: 'First Corridor'
    num_vehicles: 1
    capacity: 42
    weight: 32
    introduction_date: 1951-04-21
    spritesheet: BRMk1FK.png
    special_tags:
      - formation/1-car
      - subclass/mk1_fk

  # The Brake Composite Corridor reads y=130 of the five per-livery family sheets, per
  # `spriteset_BRMk1BCK_*` in BRTrains2
  # `src/trains/rolling_stock/BR/Mk1/sprites/Mk1BCK.pnml` (all five at
  # `template_train32px(0, 130)`; the switch `sw_BRMk1BCK` reads them in the shared
  # `sw_BRMk1_cargo_subtype_text` order 0..4), so it keeps a sheet of its own,
  # `BRMk1BCK.png`, composed by `BRTrains3-artwork-tools/compose_br_mk1_type_sheet.py 130`.
  # y=130 is read by no other Mk1 type.
  - identifier: bck
    name: 'Brake Composite Corridor'
    num_vehicles: 1
    capacity: 24
    weight: 36
    introduction_date: 1952-04-21
    spritesheet: BRMk1BCK.png
    special_tags:
      - formation/1-car
      - subclass/mk1_bck

  # The Brake First Corridor reads y=156 of the five per-livery family sheets, per
  # `spriteset_BRMk1BFK_*` in BRTrains2
  # `src/trains/rolling_stock/BR/Mk1/sprites/Mk1BFK.pnml` (all five at
  # `template_train32px(0, 156)`; the switch `sw_BRMk1BFK` reads them in the shared
  # `sw_BRMk1_cargo_subtype_text` order 0..4), so it keeps a sheet of its own,
  # `BRMk1BFK.png`, composed by `BRTrains3-artwork-tools/compose_br_mk1_type_sheet.py 156`.
  # y=156 is read by no other Mk1 type.
  - identifier: bfk
    name: 'Brake First Corridor'
    num_vehicles: 1
    capacity: 24
    weight: 36
    introduction_date: 1951-04-21
    spritesheet: BRMk1BFK.png
    special_tags:
      - formation/1-car
      - subclass/mk1_bfk

liveries:
  # Ordered by BRTrains2's `switch(FEAT_TRAINS, SELF, sw_BRMk1TSO, cargo_subtype)` (0..4),
  # which is also `sw_BRMk1_cargo_subtype_text`'s order and the composite's row order.
  - name: 'BR Carmine and Cream'
    special_tags: [operator/BR]
  - name: 'BR Chocolate and Cream'
    special_tags: [operator/BR]
  - name: 'BR Malachite Green'
    special_tags: [operator/BR]
  - name: 'BR Maroon'
    special_tags: [operator/BR]
  - name: 'BR Blue and Grey'
    special_tags: [operator/BR]
