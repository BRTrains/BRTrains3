info:
  identifier: br_mk1
  name: 'Mk1 Coach'
  sub_name: Passenger coach
  based_on: British Rail Mk1

stats:
  vehicle_type: train
  train_type: coach
  weight: 41
  length: 8
  power: 0
  speed: 90
  tractive_effort: 0

cargo: passenger
loading_speed: 10

dates:
  introduction_date: 1952-04-21

profiles:
  # One profile per Mk1 coach type. Each type has its own band of the five per-livery
  # sheets the legacy draws the family from (`BRTrains2/gfx/Rolling Stock/Mk1/`), so each
  # type keeps a sheet of its own: `BRMk1.png` holds the Tourist Standard Open's five
  # bands (source band y=0 of Mk1_CarmineCream.png, Mk1_ChocolateCream.png,
  # Mk1_MalachiteGreen.png, Mk1_BRMaroon.png and Mk1_BRBlue.png), composed by
  # `BRTrains3-artwork-tools/compose_br_mk1_sheet.py`. A later Mk1 type is a second
  # profile with its own `spritesheet`, as on the Mk3.
  - identifier: tso
    name: 'Tourist Standard Open'
    num_vehicles: 1
    capacity: 64
    introduction_date: 1952-04-21
    special_tags:
      - formation/1-car
      - subclass/mk1_tso

liveries:
  # Ordered by BRTrains2's `switch(FEAT_TRAINS, SELF, sw_BRMk1TSO, cargo_subtype)` (0..4),
  # which is also `sw_BRMk1_cargo_subtype_text`'s order and the composite's row order.
  - name: 'BR Carmine and Cream'
    special_tags: [operator/BR]
  - name: 'BR Chocolate and Cream'
    special_tags: [operator/BR]
  - name: 'BR Malachite Green'
    special_tags: [operator/BR]
  - name: 'BR Maroon'
    special_tags: [operator/BR]
  - name: 'BR Blue and Grey'
    special_tags: [operator/BR]
