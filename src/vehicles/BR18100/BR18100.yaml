info:
  identifier: br_18100
  name: 'BR 18100 (Gas Turbine Prototype)'
  sub_name: Experimental gas turbine-electric locomotive
  based_on: British Rail 18100

stats:
  vehicle_type: train
  train_type: locomotive
  weight: 129.5
  length: 8
  power: 3000
  speed: 90
  tractive_effort: 0.3
  power_type:
    - gas_turbine

# The legacy item declares refittable_cargo_classes: 0 and a zero-returning
# cargo capacity callback, so cargo: none states the effective behaviour.
cargo: none
loading_speed: 3

dates:
  # BRTrains2/src/trains/electric_loco/18100.pnml declares date(1951,1,1).
  introduction_date: 1951-01-01

profiles:
  - identifier: DEFAULT
    num_vehicles: 1
    capacity: 0
    special_tags:
      - formation/1-car
      - subclass/18100

# The legacy's only graphics case is cargo_subtype 0 / BR Black, and it reads
# BRTrains2/gfx/Electric/8X.png at template_train32px(0, 13). A gas turbine is
# self-powered, so no track_type is declared and power_type resolves to RAIL,
# matching the legacy's explicit RAIL. BRBuild's gas_turbine fuel gives
# ENGINE_CLASS_DIESEL with VISUAL_EFFECT_DISABLE, which is what the legacy's
# engine_class/effect_spawn_model_and_powered pair did (18100.pnml has no
# create_effect callback, so it showed no exhaust).
liveries:
  - name: 'BR Black'
    special_tags: [operator/BR]
