liveries:
  # Order is the legacy `sw_BR483_cargo_subtype_text` order (0 then 1), which is also the
  # composite's row order (`/home/jon/BRTrains3-artwork-tools/compose_br483_sheet.py`):
  # 0 = `spriteset_BR483{a,b}_Island` (y=247/273), 1 = `spriteset_BR483{a,b}_NSE`
  # (y=169/195). Names are the legacy switch's own text strings `str_LU_TfL` and `str_NSE`;
  # the y=169/195 bands carry NSE blue and the y=247/273 bands LT red, so the labels match
  # the artwork. The `_Island` spriteset names against the "London Underground" text string
  # are recorded as a query in the import oddities file.
  - name: 'London Underground'
    special_tags: [operator/London Underground]
  - name: 'Network SouthEast'
    special_tags: [operator/Network SouthEast]
