  - name: 'CrossCountry Red'
    special_tags: [operator/CrossCountry]
  - name: 'National Express East Anglia'
    special_tags: [operator/National Express East Anglia]
  - name: 'Greater Anglia'
    special_tags: [operator/Greater Anglia]
  - name: 'Transport for Wales'
    special_tags: [operator/Transport for Wales]
  - name: 'West Midlands Railway'
    special_tags: [operator/West Midlands Railway]
  - name: 'Bombardier'
    special_tags: [operator/Bombardier]
  - name: 'London Midland'
    special_tags: [operator/London Midland]
  - name: 'Central Trains Midland Mainline'
