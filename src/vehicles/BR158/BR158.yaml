# The two formations carry different livery sets, as the legacy's own `sw_BR158_2car` and
# `sw_BR158_3car` switches do, so each livery is restricted to the profiles that offer it.
# Names come from `sw_BR158_cargo_subtype_text` / `sw_BR158_3_cargo_subtype_text` via the
# `str_*` strings in `lang/partial/livery_prebuilt_strings.plng`; the legacy's own
# `str_BR158_liveries` / `str_BR158_3car_liveries` lists are stale (they omit
# Alphaline, Arriva, EMR, GWR, TfW and Northern's Tour of Yorkshire).
