liveries:
  # Ordered by the two legacy graphics switches `sw_SR_Q1_Loco` and `sw_SR_Q1_tender`, which
  # `sw_SR_Q1_cargo_subtype_text` labels 0..1 - the order the purchase list showed the
  # player. `sw_SR_Q1_Loco` returns the *same* engine drawing for both subtypes, so the
  # sheet carries two identical locomotive rows and only the tender differs
  # (/home/jon/BRTrains3-artwork-tools/compose_sr_q1_sheet.py's ROWS table):
  #
  #   0 str_SRBlack  "(Southern Railway - Black)"  SR_Bulleid_Q1.png loco y=13 + tender y=13
  #   1 str_BRLion   "(BR - Black & Lion)"         SR_Bulleid_Q1.png loco y=13 + tender y=39
  #
  # `str_BRLion` is the same livery string the LMS Jubilee imports as "BR Black (Lion and
  # Wheel)", naming the early BR lion-on-wheel tender emblem the y=39 tender band draws.
  - name: 'SR Black'
    special_tags: [operator/Southern Railway]
  - name: 'BR Black (Lion and Wheel)'
    special_tags: [operator/BR]
