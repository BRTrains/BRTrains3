info:
  identifier: br_86
  name: 'Class 86 "AL6"'
  sub_name: Electric mixed-traffic locomotive
  based_on: British Rail Class 86

stats:
  vehicle_type: train
  train_type: locomotive
  weight: 81
  length: 8
  power: 4000
  speed: 110
  tractive_effort: 0.3
  track_type:
    - ELRL
  power_type:
    - electric

# The legacy item declares refittable_cargo_classes: 0 and a zero-returning
# cargo capacity callback, so cargo: none states the effective behaviour.
cargo: none
loading_speed: 3

dates:
  introduction_date: 1973-01-01

profiles:
  - identifier: DEFAULT
    num_vehicles: 1
    capacity: 0
    special_tags:
      - formation/1-car
      - subclass/86

# Ordered by sw_BR86_cargo_subtype and sw_BR86_cargo_subtype_text. The source
# rows are re-stacked by compose_br86_sheet.py into this same order.
liveries:
  - name: 'BR Blue'
    special_tags: [operator/BR]
  - name: 'InterCity Executive'
    special_tags: [operator/InterCity]
  - name: 'InterCity Swallow'
    special_tags: [operator/InterCity]
  - name: 'Railfreight Distribution'
    special_tags: [operator/Railfreight]
  # `str_REX` reads `(Rail Express Systems)` and `str_FreightlinerGreen` /
  # `str_FreightlinerPH` read `(Freightliner - Green)` / `(Freightliner - Powerhaul)`,
  # so the names are the legacy's own with BRTrains3's operator-prefix style.
  - name: 'Rail Express Systems'
    special_tags: [operator/Rail Express Systems]
  - name: 'EWS Red and Gold'
    special_tags: [operator/EWS]
  - name: 'Anglia'
    special_tags: [operator/Anglia]
  - name: 'BR Electric Blue'
    special_tags: [operator/BR]
  - name: 'Colas Rail'
    special_tags: [operator/Colas Rail]
  - name: 'Freightliner Green'
    special_tags: [operator/Freightliner]
  - name: 'Freightliner Powerhaul'
    special_tags: [operator/Freightliner]
