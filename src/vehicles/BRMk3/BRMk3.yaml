info:
  identifier: br_mk3
  name: 'Mk3 Coach'
  sub_name: Passenger coach
  based_on: British Rail Mk3

stats:
  vehicle_type: train
  train_type: coach
  weight: 43
  length: 8
  power: 0
  tractive_effort: 0

cargo: passenger
loading_speed: 14

dates:
  # Fallback only: both profiles carry the date their own vehicle entered service.
  introduction_date: 1982-01-01

profiles:
  # The sleeper draws rows 1-8 of the candidate's own sheet (BRMk3.png), in livery order.
  - identifier: sleeper
    name: 'Sleeper'
    num_vehicles: 1
    capacity: 26
    speed: 125
    introduction_date: 1982-01-01
    special_tags:
      - formation/1-car
      - subclass/mk3_sleeper

  # The DVT is an unpowered driving vehicle, so it keeps its own sheet: its rows are not
  # intermingled with the coach rows the rest of the family will use. `has_cab` tells OpenTTD
  # the van may lead a rake, so the train backs up rather than magic-flipping.
  - identifier: dvt
    name: 'DVT'
    num_vehicles: 1
    capacity: 0
    speed: 140
    introduction_date: 1989-01-01
    has_cab: true
    spritesheet: BRMk3DVT.png
    special_tags:
      - formation/1-car
      - subclass/mk3_dvt

liveries:
