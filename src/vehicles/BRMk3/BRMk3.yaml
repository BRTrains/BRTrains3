info:
  identifier: br_mk3
  name: 'Mk3 Coach'
  sub_name: Passenger coach
  based_on: British Rail Mk3

stats:
  vehicle_type: train
  train_type: coach
  weight: 43
  length: 8
  power: 0
  tractive_effort: 0

cargo: passenger
loading_speed: 14

dates:
  # Fallback only: both profiles carry the date their own vehicle entered service.
  introduction_date: 1982-01-01

profiles:
  # The sleeper draws rows 1-8 of the candidate's own sheet (BRMk3.png), in livery order.
  - identifier: sleeper
    name: 'Sleeper'
    num_vehicles: 1
    capacity: 26
    speed: 125
    introduction_date: 1982-01-01
    special_tags:
      - formation/1-car
      - subclass/mk3_sleeper

  # The DVT is an unpowered driving vehicle, so it keeps its own sheet: its rows are not
  # intermingled with the coach rows the rest of the family will use. `has_cab` tells OpenTTD
  # the van may lead a rake, so the train backs up rather than magic-flipping.
  - identifier: dvt
    name: 'DVT'
    num_vehicles: 1
    capacity: 0
    speed: 140
    introduction_date: 1989-01-01
    has_cab: true
    spritesheet: BRMk3DVT.png
    special_tags:
      - formation/1-car
      - subclass/mk3_dvt

  # The six loco-hauled Mk3 coach types each draw one band per livery of their own sheet
  # (`BRTrains2/gfx/Rolling Stock/Mk3/BRMk3<Type>.png`, 171x500 on the legacy
  # `template_train32px_old` grid) and each keeps a sheet of its own, composed by
  # `BRTrains3-artwork-tools/compose_br_mk3_coach_sheet.py <Type>`, which repacks every band
  # onto the modern `tmpl_train_8` grid. `sw_253_BRMk3<Type>` reads one spriteset per livery,
  # so each type is one single-car profile over the same seventeen-livery list.
  #
  # Capacities are the legacy `cargo_capacity` callbacks, already per-part (`72` TS, `48` TF,
  # `59` TGS, `34` TRSB/TRUB/TRUK), and the weight is left to the candidate's own 43 t: every
  # coach item declares `weight: 0` (a placeholder, not a figure), so nothing was invented.
  - identifier: ts
    name: 'Trailer Second'
    num_vehicles: 1
    capacity: 72
    introduction_date: 1975-04-21
    spritesheet: BRMk3TS.png
    special_tags:
      - formation/1-car
      - subclass/mk3_ts

  - identifier: tf
    name: 'Trailer First'
    num_vehicles: 1
    capacity: 48
    introduction_date: 1975-04-21
    spritesheet: BRMk3TF.png
    special_tags:
      - formation/1-car
      - subclass/mk3_tf

  - identifier: tgs
    name: 'Trailer Guard Second'
    num_vehicles: 1
    capacity: 59
    introduction_date: 1975-04-21
    spritesheet: BRMk3TGS.png
    special_tags:
      - formation/1-car
      - subclass/mk3_tgs

  - identifier: trsb
    name: 'Trailer Buffet Second'
    num_vehicles: 1
    capacity: 34
    introduction_date: 1975-04-21
    spritesheet: BRMk3TRSB.png
    special_tags:
      - formation/1-car
      - subclass/mk3_trsb

  - identifier: trub
    name: 'Trailer Buffet Unclassified'
    num_vehicles: 1
    capacity: 34
    introduction_date: 1975-04-21
    spritesheet: BRMk3TRUB.png
    special_tags:
      - formation/1-car
      - subclass/mk3_trub

  - identifier: truk
    name: 'Trailer Kitchen'
    num_vehicles: 1
    capacity: 34
    introduction_date: 1975-04-21
    spritesheet: BRMk3TRUK.png
    special_tags:
      - formation/1-car
      - subclass/mk3_truk

