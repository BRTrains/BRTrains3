info:
  identifier: br_450
  name: 'Class 450 "Desiro"'
  sub_name: Electric multiple unit
  based_on: British Rail Class 450 Desiro

stats:
  vehicle_type: train
  train_type: multiple_unit
  weight: 190
  length: 8
  power: 2682
  speed: 100
  tractive_effort: 0.3
  power_type:
    - electric
  # All four legacy items declare `track_type: THIRD` (750 V DC third rail, no overhead
  # equipment), so the logical type is stated rather than left to the classifier's
  # `power_type` default, which would give this DC unit `ELRL`.
  track_type:
    - THIRD

cargo: passenger

loading_speed: 25
cargo_age_period: 185

dates:
  introduction_date: 2002-04-21

profiles:
  # One 4-car formation: the legacy root item `item_BR450` 288 plus
  # `switch_articulated_BR450`'s parts 1..3 (`item_BR450b` 289, `item_BR450c` 290,
  # `item_BR450d` 291) referencing the same item, so the consist is positions a, b, c, d.
  # Position 2 (c) re-reads position 1's drawing (`spriteset_BR450c_SWT` and
  # `spriteset_BR450b_SWT` are both `template_train32px_old(0, 625)`; the SWR pair both
  # read y=525), so the group holds three rows -- front (a), intermediate (b, reused by
  # c) and rear (d) -- and the pattern is [1, 2, 2, 3] over them.
  - identifier: '450_4'
    name: 4-Car
    num_vehicles: 4
    # `item_BR450`'s callback is `return(70 * param_pax)` -- already per part, so it is
    # copied as-is (BRBuild's `capacity` is the per-part value: 4 x 70 = 280 in game).
    # The legacy's other three items carry their own per-part figures instead (b 72,
    # c 60, d 70), which BRBuild cannot express: the callback sits on the single item all
    # articulated parts reference. See the oddities note.
    capacity: 70
    sprite_override: [1, 2, 2, 3]
    special_tags:
      - formation/4-car

liveries:
  # BRTrains2's `switch(FEAT_TRAINS, SELF, sw_BR450a..d, cargo_subtype)` selects the drawing
  # band per livery and `sw_BR450_cargo_subtype_text` names it (case 0 `str_SWT`, case 1
  # `str_SWR`), so the order below is the switch's case order, which is also the composite's
  # row order (see /home/jon/BRTrains3-artwork-tools/compose_br450_sheet.py). All two
  # liveries draw the shared artist sheet `gfx/BR350_450_Desiro.png`, whose bands at
  # y 500..675 belong to this unit (the Class 350, imported earlier, owns y 0..475 and
  # y 700..775).
  - name: 'South West Trains'
    special_tags: [operator/South West Trains]
  - name: 'South Western Railway'
    special_tags: [operator/South Western Railway]
