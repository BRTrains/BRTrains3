info:
  identifier: br_pacer
  # One candidate for the four Pacer classes: the legacy set files all four under one
  # `variant_group: header_Pacer`, draws them on one sheet and one template, and gives
  # each class its own `cargo_subtype` livery list. The `STR_NAME_BR14x` strings are the
  # class designations plus the family nickname, so the candidate carries the family name
  # and each profile carries its class.
  name: 'Class 140/141/142/143 Pacer'
  sub_name: Diesel multiple unit
  based_on: British Rail Class 140, 141, 142 and 143 Pacer

stats:
  vehicle_type: train
  train_type: multiple_unit
  # BRBuild's power, weight and capacity are per-part; the legacy items carry whole-consist
  # figures per class, set on the profiles below (see the oddities file for the set-wide
  # per-part question).
  length: 7
  speed: 75
  tractive_effort: 0.3
  power_type:
    - diesel

cargo: passenger

loading_speed: 22
cargo_age_period: 185

dates:
  introduction_date: 1981-04-21

profiles:
  # One profile per legacy item (item_BR140 752, item_BR141 753, item_BR142 754,
  # item_BR143 755). All four classes are two-car units whose legacy switch draws front
  # then rear off a two-row group (`sw_BR14x_<livery>`, `position_in_articulated_veh % 2`),
  # so every profile is `sprite_override: [1, 2]` over its own two rows per livery.
  # Row consumption order is profile-outer, livery-inner, in the order the composite
  # packs them (`BRTrains3-artwork-tools/compose_pacer_sheet.py`).
  - identifier: '140'
    name: 'Class 140'
    num_vehicles: 2
    capacity: 52
    power: 410
    weight: 23
    introduction_date: 1981-04-21
    sprite_override: [1, 2]
    special_tags:
      - formation/2-car
      - subclass/140
  - identifier: '141'
    name: 'Class 141'
    num_vehicles: 2
    capacity: 47
    power: 410
    weight: 26
    introduction_date: 1984-04-21
    sprite_override: [1, 2]
    special_tags:
      - formation/2-car
      - subclass/141
  - identifier: '142'
    name: 'Class 142'
    num_vehicles: 2
    capacity: 56
    power: 250
    weight: 24
    introduction_date: 1985-04-21
    sprite_override: [1, 2]
    special_tags:
      - formation/2-car
      - subclass/142
  - identifier: '143'
    name: 'Class 143'
    num_vehicles: 2
    capacity: 56
    power: 250
    weight: 24
    introduction_date: 1985-04-21
    sprite_override: [1, 2]
    special_tags:
      - formation/2-car
      - subclass/143

liveries:
  # Each livery is restricted to the classes whose legacy `cargo_subtype` switch names it,
  # and is listed in that switch's own order (the composite packs the rows in this order).
  # `profiles:` is the restriction the loader and VariantIterator apply.
  - name: 'BR Blue'
    profiles: ['140', '141']
    special_tags: [operator/BR]
  - name: 'WYPTE Metro'
    profiles: ['141', '142', '143']
    special_tags: [operator/West Yorkshire PTE]
  - name: 'WYPTE Verona'
    profiles: ['141']
    special_tags: [operator/West Yorkshire PTE]
  - name: 'BR Provincial'
    profiles: ['142']
    special_tags: [operator/BR Provincial]
  - name: 'Regional Railways'
    profiles: ['142', '143']
    special_tags: [operator/Regional Railways]
  - name: 'Northern Rail'
    profiles: ['142', '143']
    special_tags: [operator/Northern Rail]
  - name: 'Northern Spirit'
    profiles: ['142']
    special_tags: [operator/Northern Spirit]
  - name: 'Arriva Trains Wales'
    profiles: ['142']
    special_tags: [operator/Arriva Trains Wales]
  - name: 'North Western Trains'
    profiles: ['142']
    special_tags: [operator/North Western Trains]
  - name: 'Merseyrail'
    profiles: ['142']
    special_tags: [operator/Merseyrail]
  - name: 'Valley Lines'
    profiles: ['143']
    special_tags: [operator/Valley Lines]
  - name: 'Wessex Trains York'
    profiles: ['143']
    special_tags: [operator/Wessex Trains]
  - name: 'Great Western Railway Green'
    profiles: ['143']
    special_tags: [operator/Great Western Railway]
