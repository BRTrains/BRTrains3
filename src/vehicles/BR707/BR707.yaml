info:
  identifier: br_707
  name: 'Class 707 "Desiro City"'

stats:
  vehicle_type: train
  train_type: multiple_unit
  weight: 306
  length: 8
  power: 2750
  speed: 100
  tractive_effort: 0.15
  power_type:
    - electric
  track_type:
    - THIRD

cargo: passenger

loading_speed: 25

dates:
  introduction_date: 2015-04-21

profiles:
  - identifier: DEFAULT
    num_vehicles: 5
    # `item_BR707`'s callback is `return(56 * param_pax)` and its `cargo_capacity` property
    # reads 56 -- already the per-part figure, so it is copied as-is (BRBuild's `capacity` is
    # the per-part value: 5 x 56 = 280 in game, where the real unit seats 275). The three
    # articulated items carry their own `53` instead (`return(53 * param_pax)`), which
    # BRBuild's single-item callback cannot express per part -- a query.
    capacity: 56
    sprite_override: [1, 2, 3, 3, 4]
    special_tags:
      - formation/5-car

liveries:
  - name: 'South West Trains'
    special_tags: [operator/South West Trains]
  - name: 'Southeastern'
    special_tags: [operator/Southeastern]
