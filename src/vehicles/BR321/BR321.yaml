info:
  identifier: br_321
  name: 'Class 321 "Dusty Bin"'
  sub_name: Electric multiple unit
  based_on: British Rail Class 321

stats:
  vehicle_type: train
  train_type: multiple_unit
  speed: 100
  length: 8
  tractive_effort: 0.3
  power_type:
    - electric
  # The legacy item declares track_type ELRL explicitly (its own comment notes that
  # ENGINE_CLASS_ELECTRIC would otherwise give overhead-wire effects on 3rd-rail stock).
  track_type:
    - ELRL

cargo: passenger

loading_speed: 25

dates:
  introduction_date: 1988-03-17

profiles:
  # The legacy item is one 4-car unit (articulated parts 1..3). The sheet holds one
  # four-row block per livery in the declared order front, rear, middle, middle_panto,
  # and switch_BR321_spriteset reads positions 0..3 as front, middle_panto, middle, rear.
  - identifier: '321_4'
    name: 4-Car
    num_vehicles: 4
    capacity: 78
    power: 1600
    weight: 137
    sprite_override: [1, 4, 3, 2]
    special_tags:
      - formation/4-car
      - subclass/321_4

liveries:
  # Sheet block order, which is also switch_BR321_spriteset's cargo_subtype order (0..12):
  # each livery owns four consecutive rows. Labels use the operators' own names from
  # BRTrains2's lang files (switch_BR321_subtype_text) — see the import oddities file.
  - name: 'Network South East'
    special_tags: [operator/Network SouthEast]
  - name: 'Nederlandse Spoorwegen'
    special_tags: [operator/Nederlandse Spoorwegen]
  - name: 'Greater Anglia'
    special_tags: [operator/Greater Anglia]
  - name: 'Silverlink'
    special_tags: [operator/Silverlink]
  - name: 'London Midland'
    special_tags: [operator/London Midland]
  - name: 'WYPTE Metro'
    special_tags: [operator/West Yorkshire PTE]
  - name: 'London Overground'
    special_tags: [operator/London Overground]
  - name: 'First Great Eastern'
    special_tags: [operator/First Great Eastern]
  - name: 'Arriva Trains Northern'
    special_tags: [operator/Arriva Trains Northern]
  - name: 'Greater Anglia Interim'
    special_tags: [operator/Greater Anglia]
  - name: 'Greater Anglia Renatus'
    special_tags: [operator/Greater Anglia]
  - name: 'First Capital Connect Urban Lights'
    special_tags: [operator/First Capital Connect]
  - name: 'National Express East Anglia'
    special_tags: [operator/National Express East Anglia]
