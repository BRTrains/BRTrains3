profiles:
  # `switch_articulated_BR315` adds parts at offsets 1..3, returning `item_BR315_c` (offset 1),
  # `item_BR315_b` (offset 2) and `item_BR315_d` (offset 3), while the root item's `default:` is
  # `sw_BR315_a`. Positions 0..3 therefore consume the declared a, c, b, d drawings, which is
  # the pattern [1, 3, 2, 4] against the composite's row order
  # (`/home/jon/BRTrains3-artwork-tools/compose_br315_sheet.py` packs each livery's rows as
  # a, c, b, d in exactly that order).
  #
  # Capacity: the root item's callback is `return(74 * param_pax)`, already per-part, so 74 is
  # imported; the legacy's two trailers declare 86 and 84, giving a legacy in-game total of
  # 318 against BRBuild's 4 x 74 = 296 (one capacity callback attaches to the item every
  # articulated part references, so a single per-part figure cannot express all three —
  # recorded in the oddities file).
  #
  # No `design_speed`: `BR315.pnml` carries no `param_max_speed` switch, so no figure was
  # invented and the service speed stands alone.
  - identifier: '315_4'
    name: '4-Car'
    num_vehicles: 4
    capacity: 74
    sprite_override: [1, 3, 2, 4]
    special_tags:
      - formation/4-car

