info:
  identifier: br_80
  name: 'Class 80 (25kV Prototype)'
  sub_name: Electric mixed-traffic locomotive
  based_on: British Rail Class 80

stats:
  vehicle_type: train
  train_type: locomotive
  weight: 109
  length: 8
  power: 2500
  speed: 90
  tractive_effort: 0.3
  track_type:
    - ELRL
  power_type:
    - electric

# The legacy item declares refittable_cargo_classes: 0 and a zero-returning
# cargo capacity callback, so cargo: none states the effective behaviour.
cargo: none
loading_speed: 3

dates:
  # BRTrains2/src/trains/electric_loco/80.pnml declares date(1958,1,1).
  introduction_date: 1958-01-01

profiles:
  - identifier: DEFAULT
    num_vehicles: 1
    capacity: 0
    special_tags:
      - formation/1-car
      - subclass/80

# The sole legacy graphics case is cargo_subtype 0 / BR Black. It reads
# BRTrains2/gfx/Electric/8X.png at template_train32px(0, 39).
liveries:
  - name: 'BR Black'
    special_tags: [operator/BR]
