liveries:
  # Ordered by the two legacy graphics switches `sw_LNERA3` (locomotive) and `sw_LNERA3T`
  # (tender), which `sw_LNERA3_cargo_subtype_text` labels 0..5 - the order the purchase list
  # showed the player. Both switches carry all six slots and name the same livery names, so
  # the sheet is packed one locomotive row + one tender row per livery in this order
  # (/home/jon/BRTrains3-artwork-tools/compose_lner_a3_sheet.py's ROWS table).
  #
  #   0 str_LNERGreen           GNR_A1.png loco y=13 + LNER_A3T.png tender y=13
  #   1 str_LNERCorridorTender  GNR_A1.png loco y=13 + LNER_A3T.png tender y=33
  #   2 str_Wartime             LNER_A3.png loco y=13 + LNER_A3T.png tender y=53
  #   3 str_Apple               LNER_A3.png loco y=38 + LNER_A3T.png tender y=73
  #   4 str_BRBlue              LNER_A3.png loco y=63 + LNER_A3T.png tender y=93
  #   5 str_Brunswick           LNER_A3.png loco y=88 + LNER_A3T.png tender y=113
  #
  # Subtype 1 is named for the tender it carries ("LNER Corridor Tender") rather than a
  # colour: its locomotive drawing is byte-identical to subtype 0's (0 of 4,104 pixels
  # differ) and only the tender band changes. Recorded as a query in the oddities file.
  - name: 'LNER Green'
    special_tags: [operator/LNER]
  - name: 'LNER Corridor Tender'
    special_tags: [operator/LNER]
  - name: 'LNER Wartime Black'
    special_tags: [operator/LNER, operator/BR]
  - name: 'BR Apple Green'
    special_tags: [operator/BR]
  - name: 'BR Blue'
    special_tags: [operator/BR]
  - name: 'BR Brunswick Green'
    special_tags: [operator/BR]
