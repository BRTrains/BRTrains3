info:
  identifier: br_380
  name: "Class 380"
  nickname: "Desiro"

stats:
  vehicle_type: train
  train_type: multiple_unit
  # Both legacy items state the same whole-consist figures (`power: 2682 hp`,
  # `weight: 132 ton`), so they sit at the vehicle level. The real 380/1 (4-car) is ~40 t
  # heavier than the 380/0 (3-car), so the 4-car inheriting the 3-car's weight is recorded
  # as a query rather than invented.
  weight: 132
  length: 8
  power: 2682
  speed: 100
  tractive_effort: 0.3
  power_type:
    - electric
  track_type:
    - ELRL

cargo: passenger

model_life: 0

dates:
  introduction_date: 2010-12-08

profiles:
  - identifier: '380_0'
    name: '380/0'
    num_vehicles: 3
    # `item_BR380_3car`'s callback is `return(191/3 * param_pax)`, already the per-part
    # figure (191/3 = 63 in NML's integer division; BRBuild multiplies it by the part
    # count, so a 3-car reads 189 in game). The property beside it is `(313/4)` = 78,
    # which is the 4-car's consist total — see the query in the oddities file.
    capacity: 63
    sprite_group: '380_0'
    sprite_override: [1, 3, 4]

  - identifier: '380_1'
    name: '380/1'
    num_vehicles: 4
    capacity: 63
    sprite_group: '380_0'

liveries:
  - name: 'ScotRail Saltire'
    special_tags: [operator/ScotRail]
