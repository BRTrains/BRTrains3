info:
  identifier: br_185
  name: 'Class 185 "Desiro"'
  sub_name: Diesel multiple unit
  based_on: British Rail Class 185 Desiro

stats:
  vehicle_type: train
  train_type: multiple_unit
  # The legacy items (`BRTrains2/src/trains/diesel_mu/BR185.pnml`: `item_BR185` 70,
  # `item_185b` 71, `item_185c` 72) carry the whole-consist weight and power on the root
  # item; the articulated parts declare 0. BRBuild has one item per candidate, so these
  # are the legacy's own figures, copied as-is — the same set-wide per-part weight/power
  # question already noted against the Class 180/220/222.
  weight: 169
  length: 8
  power: 2250
  speed: 100
  tractive_effort: 0.3
  power_type:
    - diesel
  # The legacy declares `track_type: RAIL`; the classifier emits the same for a
  # self-powered unit, so it is left unset here, as on the rest of the diesel fleet.
  # (`air_drag_coefficient: 0.1` and the articulated parts' `TRAIN_FLAG_NO_BREAKDOWN_SMOKE`
  # are legacy fields the BRBuild schema does not express.)

cargo: passenger

loading_speed: 20
cargo_age_period: 215

dates:
  introduction_date: 2005-04-21

profiles:
  # One legacy item set and one formation: the 185 is a three-car unit. The legacy
  # `switch_articulated_BR185` adds `item_185b` at position 1 and `item_185c` at position 2,
  # so the consist draws the a drawing, then b, then c — `sprite_override: [1, 2, 3]` over
  # the three-row group `compose_br185_sheet.py` packs per livery.
  - identifier: DEFAULT
    num_vehicles: 3
    # `item_BR185`'s callback is `return(56 * param_pax / 3)` — a consist total divided by
    # the part count — so the per-part figure is 18 (56 // 3). The legacy's own
    # `cargo_capacity: 56` property is the placeholder the callback overrides (the same
    # property/callback disagreement as the Class 150/2, 151, 156 and 159).
    capacity: 18
    sprite_override: [1, 2, 3]
    special_tags:
      - formation/3-car
      - subclass/185

liveries:
  # Names from BRTrains2's `sw_BR185_cargo_subtype_text` (subtype order 0..2) expanded
  # through `lang/partial/livery_prebuilt_strings.plng`: `str_FirstDynamic` "(First
  # Transpennine - Dynamic Lines)", `str_FirstGroup` " (First Group)",
  # `str_FirstTPEGeometric` "(First TransPennine - Geometric)". That subtype order is the
  # YAML livery order, and the composite packs the row triples in it.
  #
  # All three are the same real operator in two brandings: the class entered service under
  # FirstGroup's "First TransPennine Express" franchise (Dynamic Lines, then the Geometric
  # version of the same brand), and the plain First Group scheme. Both badges are attached
  # to the two First TransPennine Express schemes (the operator plus its parent brand);
  # no third operator badge was invented for a colour variation.
  - name: 'First TransPennine Express - Dynamic Lines'
    special_tags: [operator/TransPennine Express, operator/FirstGroup]
  - name: 'FirstGroup'
    special_tags: [operator/FirstGroup]
  - name: 'First TransPennine Express - Geometric'
    special_tags: [operator/TransPennine Express, operator/FirstGroup]
