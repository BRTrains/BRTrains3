info:
  identifier: br_185
  name: 'Class 185 "Desiro"'

stats:
  vehicle_type: train
  train_type: multiple_unit
  weight: 169
  length: 8
  power: 2250
  speed: 100
  tractive_effort: 0.3
  power_type:
    - diesel
  # The legacy declares `track_type: RAIL`; the classifier emits the same for a
  # self-powered unit, so it is left unset here, as on the rest of the diesel fleet.
  # (`air_drag_coefficient: 0.1` and the articulated parts' `TRAIN_FLAG_NO_BREAKDOWN_SMOKE`
  # are legacy fields the BRBuild schema does not express.)

cargo: passenger

dates:
  introduction_date: 2005-04-21

profiles:
  - identifier: DEFAULT
    num_vehicles: 3
    capacity: 18

liveries:
  # Names from BRTrains2's `sw_BR185_cargo_subtype_text` (subtype order 0..2) expanded
  # through `lang/partial/livery_prebuilt_strings.plng`: `str_FirstDynamic` "(First
  # Transpennine - Dynamic Lines)", `str_FirstGroup` " (First Group)",
  # `str_FirstTPEGeometric` "(First TransPennine - Geometric)". That subtype order is the
  # YAML livery order, and the composite packs the row triples in it.
  #
  # All three are the same real operator in two brandings: the class entered service under
  # FirstGroup's "First TransPennine Express" franchise (Dynamic Lines, then the Geometric
  # version of the same brand), and the plain First Group scheme. Both badges are attached
  # to the two First TransPennine Express schemes (the operator plus its parent brand);
  # no third operator badge was invented for a colour variation.
  - name: 'First TransPennine Express - Dynamic Lines'
    special_tags: [operator/TransPennine Express, operator/FirstGroup]
  - name: 'FirstGroup'
    special_tags: [operator/FirstGroup]
  - name: 'First TransPennine Express - Geometric'
    special_tags: [operator/TransPennine Express, operator/FirstGroup]
