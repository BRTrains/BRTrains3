info:
  identifier: lms_jubilee
  name: 'LMS Stanier Jubilee Class 4-6-0'
  sub_name: Steam locomotive
  based_on: LMS Stanier Jubilee Class

stats:
  vehicle_type: train
  train_type: locomotive
  weight: 130
  length: 5
  power: 1700
  speed: 95
  tractive_effort: 0.146
  power_type:
    - steam

cargo: none

dates:
  introduction_date: 1934-02-01

profiles:
  # The legacy item (`BRTrains2/src/trains/steam_loco/LMS/LMSJubilee.pnml`, item_LMSJubilee
  # 658) is a two-part articulated locomotive: `switch_articulated_LMSJubilee` adds exactly
  # one part and `switch_LMSJubilee_length` gives part 0 length 5 and part 1 length 4, so the
  # sheet carries one locomotive row and one tender row per livery.
  - identifier: DEFAULT
    num_vehicles: 2
    capacity: 0
    sprite_override: [1, 2]
    special_tags:
      - formation/loco+tender

liveries:
  # Ordered by the PNML graphics switches (`sw_LMSJubileeLoco` / `sw_LMSJubileeTender`,
  # cargo_subtype 0..7), not by spriteset declaration or source y:
  #   0 LMS Red | 1 LMS Black | 2 BR Transitional Red | 3 BR Maroon | 4 BR Black (Lion and
  #   Wheel) | 5 BR Black (Emblem) | 6 BR Brunswick Green | 7 BR Blue
  # compose_lms_jubilee_sheet.py emits one locomotive+tender row pair per livery, in this
  # order, which is the order the allocator consumes rows in.
  - name: 'LMS Red'
    special_tags: [operator/LMS]
  - name: 'LMS Black'
    special_tags: [operator/LMS]
  - name: 'BR Transitional Red'
    special_tags: [operator/BR]
  - name: 'BR Maroon'
    special_tags: [operator/BR]
  - name: 'BR Black (Lion and Wheel)'
    special_tags: [operator/BR]
  - name: 'BR Black (Emblem)'
    special_tags: [operator/BR]
  - name: 'BR Brunswick Green'
    special_tags: [operator/BR]
  - name: 'BR Blue'
    special_tags: [operator/BR]
