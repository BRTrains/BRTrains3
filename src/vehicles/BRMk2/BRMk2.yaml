info:
  identifier: br_mk2
  name: 'Mk2 Coach'
  sub_name: Passenger coach
  based_on: British Rail Mk2

stats:
  vehicle_type: train
  train_type: coach
  weight: 32
  length: 8
  power: 0
  tractive_effort: 0
  # No speed: the legacy Mk2 stock declares none, and a speed property of 0 does not limit the
  # consist (OpenTTD's Train::ConsistChanged only applies a non-zero figure).

cargo: passenger
loading_speed: 10

dates:
  introduction_date: 1964-04-21

profiles:
  # The DBSO is an unpowered driving vehicle, so it keeps its own sheet and carries `has_cab`:
  # it may lead a rake, and the train backs up instead of magic-flipping.
  - identifier: dbso
    name: 'DBSO'
    num_vehicles: 1
    capacity: 32
    introduction_date: 1964-04-21
    has_cab: true
    spritesheet: BRMk2DBSO.png
    special_tags:
      - formation/1-car
      - subclass/mk2_dbso

  # The Mk2d-f SO and FO read one pair of bands per livery from BRTrains2's
  # `gfx/Rolling Stock/Mk2/BRMk2_Late.png` (SO at y = 13 + 52i, FO 26 rows below), so the
  # two types share one sheet of their own, `BRMk2Late.png`, packed in the allocator's
  # order - SO's fourteen bands first, then FO's - by
  # `BRTrains3-artwork-tools/compose_br_mk2_late_sheet.py`. Both profiles name that one
  # sheet, so each group consumes its own single row off that sheet's cursor.
  #
  # The fourteenth pair (First ScotRail) is declared against `BRMk2_Buffet.png` at y=689/715
  # - the coordinates the buffet file uses for its own RSB/RFB bands - because
  # `BRMk2_Late.png` (700px tall) holds only thirteen pairs. The import takes the declared
  # pixels; see the oddities file for the open question.
  - identifier: so
    name: 'D-F Standard Class'
    num_vehicles: 1
    capacity: 64
    cargo_age_period: 185
    spritesheet: BRMk2Late.png
    special_tags:
      - formation/1-car
      - subclass/mk2_so
  - identifier: fo
    name: 'D-F First Class'
    num_vehicles: 1
    capacity: 42
    cargo_age_period: 250
    spritesheet: BRMk2Late.png
    special_tags:
      - formation/1-car
      - subclass/mk2_fo

liveries:
  - name: 'BR Blue'
    special_tags: [operator/BR]
  - name: 'Network South East'
    special_tags: [operator/Network SouthEast]
  - name: 'Regional Railways'
    special_tags: [operator/Regional Railways]
  - name: 'ScotRail'
    special_tags: [operator/ScotRail]
  - name: 'Anglia'
    special_tags: [operator/Anglia]
  - name: 'West Coast'
    special_tags: [operator/West Coast Railway]
  - name: 'One'
    special_tags: [operator/ONE]
  - name: 'InterCity'
    special_tags: [operator/InterCity]
  - name: 'Network Rail'
    special_tags: [operator/Network Rail]
  - name: 'Arriva Wales'
    special_tags: [operator/Arriva Trains Wales]
  - name: 'DRS'
    special_tags: [operator/DRS]
  - name: 'Virgin'
    special_tags: [operator/Virgin Trains]
  - name: 'FGW'
    special_tags: [operator/Great Western Railway]
  - name: 'First ScotRail'
    special_tags: [operator/ScotRail]
