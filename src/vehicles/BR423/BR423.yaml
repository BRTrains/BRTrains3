info:
  identifier: br_423
  name: 'Class 423 "4-VEP"'
  sub_name: Electric multiple unit
  based_on: British Rail Class 423

stats:
  vehicle_type: train
  train_type: multiple_unit
  # The legacy root item's own figures (whole-unit values); its three articulated parts
  # declare the same 90 mph except `item_BR423_d`, which says 75 - recorded in the oddities
  # file rather than applied as a per-profile override that the root item does not support.
  speed: 90
  length: 8
  power: 1000
  weight: 158
  tractive_effort: 0.08
  power_type:
    - electric
  track_type:
    - THIRD

cargo: passenger

loading_speed: 25
cargo_age_period: 185

dates:
  introduction_date: 1967-04-21

profiles:
  # One four-car formation. `switch_articulated_BR423` returns `item_BR423_b` at offset 1,
  # `_c` at 2 and `_d` at 3, and the root item's `default:` is `sw_BR423_a`, so the consist
  # reads the group's declared a, b, c, d rows in order and `sprite_override` is [1, 2, 3, 4].
  #
  # Capacity is per part, because BRBuild's callback sits on the item every articulated part
  # references. The legacy callbacks are `return(62 * param_pax)` (driving cars) / `58` /
  # `98` - one uniform figure cannot express three different ones, so the driving car's 62 is
  # used (in game 248 for the 4-car against the legacy's 280); recorded in the oddities file.
  - identifier: DEFAULT
    num_vehicles: 4
    capacity: 62
    sprite_override: [1, 2, 3, 4]
    special_tags:
      - formation/4-car
      - subclass/423

liveries:
  - name: 'BR Blue'
    special_tags: [operator/BR]
  - name: 'BR Blue (Yellow Front)'
    special_tags: [operator/BR]
  - name: 'BR Blue and Grey'
    special_tags: [operator/BR]
  - name: 'Network South East'
    special_tags: [operator/Network SouthEast]
  - name: 'South West Trains'
    special_tags: [operator/South West Trains]
  - name: 'Connex'
    special_tags: [operator/Connex]
  - name: 'Southern'
    special_tags: [operator/Southern]
  - name: 'South West Trains - Heritage'
    special_tags: [operator/South West Trains]
