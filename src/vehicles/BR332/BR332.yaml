info:
  identifier: br_332
  # One candidate for the two legacy items the set draws from one sheet and one livery switch:
  # `BRTrains2/src/trains/electric_mu/BR332_4car.pnml` item `item_BR332_4car` 730 and
  # `BR332_5car.pnml` item `item_BR332_5car` 731, both served by `sw_BR332_cargo_subtype_text`
  # and every `spriteset(...)` in `src/trains/electric_mu/sprites/332.pnml` - the 4-car and the
  # 5-car formation of one class. Same body, same three liveries, so one purchase-list entry with
  # one profile per formation (the Class 175/720 precedent).
  name: 'Class 332'
  sub_name: Electric multiple unit
  based_on: British Rail Class 332

stats:
  vehicle_type: train
  train_type: multiple_unit
  # Both legacy items declare the same whole-unit figures: 1900 hp, 173 t, 109 mph, length 8.
  # The 5-car carrying the 4-car's weight and capacity is the legacy's own statement - recorded
  # as a query in the import oddities file rather than corrected here.
  length: 8
  speed: 109
  power: 1900
  weight: 173
  tractive_effort: 0.06
  power_type:
    - electric
  # Both legacy items declare `track_type: ELRL` (25 kV overhead, the Heathrow Airport tunnels).
  track_type:
    - ELRL

cargo: passenger

loading_speed: 30
cargo_age_period: 185

dates:
  introduction_date: 1997-04-01

profiles:
  # The legacy root `item_BR332_4car` (730) with `switch_articulated_BR332_4car` adding parts 1..3,
  # all referencing that same item, and `switch_BR332_4car_spriteset_<livery>` reading
  # `position_in_articulated_veh % 4` as front(0), middle_panto(1), middle(2), rear(3).
  - identifier: '332_4car'
    name: '4-Car'
    num_vehicles: 4
    # Per-part: the legacy callback is `return(203/4 * param_pax)` (50.75, i.e. 50 in NML's
    # integer arithmetic) and the item's `cargo_capacity: 1` property beside it is the
    # placeholder the whole set carries.
    capacity: 50
    # The group's rows are packed front, middle, middle_panto, rear
    # (`BRTrains3-artwork-tools/compose_br332_sheet.py`), and the legacy switch reads
    # front, middle_panto, middle, rear - so the pattern is [1, 3, 2, 4].
    sprite_override: [1, 3, 2, 4]
    special_tags:
      - formation/4-car
      - subclass/332_4car

  # The legacy root `item_BR332_5car` (731) with `switch_articulated_BR332_5car` adding parts 1..4
  # and `switch_BR332_5car_spriteset_<livery>` reading `position_in_articulated_veh % 5` as
  # front(0), middle(1), middle_panto(2), middle(3), rear(4).
  - identifier: '332_5car'
    name: '5-Car'
    num_vehicles: 5
    # The legacy 5-car declares the same `return(203/4 * param_pax)` callback as the 4-car, so it
    # carries the same per-part figure rather than a five-car-appropriate one (a query).
    capacity: 50
    # Both formations read the same drawings, so the 5-car reuses the 4-car's rows through
    # `sprite_group` and the sheet holds one four-row group per livery instead of two.
    sprite_group: '332_4car'
    # The legacy switch reads front, middle, middle_panto, middle, rear over those rows.
    sprite_override: [1, 2, 3, 2, 4]
    special_tags:
      - formation/5-car
      - subclass/332_5car

liveries:
  # Order is the legacy `sw_BR332_cargo_subtype_text` cargo-subtype order 0..2, which is also the
  # composite's row order (`BRTrains3-artwork-tools/compose_br332_sheet.py`) - the allocator hands
  # each (profile, livery) group the next rows off the sheet cursor, profile-outer and
  # livery-inner, so the two must agree. The sheet's physical band order is Stripe, Purple, Blue,
  # so the composite re-stacks the Blue group ahead of the Purple one.
  #
  # Names are the legacy's own strings expanded through
  # `lang/partial/livery_prebuilt_strings.plng`: `str_HeathrowExpressSilverStripe` "(Heathrow
  # Express - Silver and Blue, Red Stripe)", `str_HeathrowExpressSilverBlue` "(Heathrow Express -
  # Silver and Blue)", `str_HeathrowExpressSilverPurple` "(Heathrow Express - Silver and Purple)",
  # written the way the Class 387/4's Heathrow livery already is in this set ("Heathrow Express
  # Grey and Purple"). All three are Heathrow Express schemes, so all three carry the one
  # operator badge; whether the units' later operator (TfL Rail / Elizabeth line) needs a livery
  # of its own is recorded as a query.
  - name: 'Heathrow Express Silver and Blue, Red Stripe'
    special_tags: [operator/Heathrow Express]
  - name: 'Heathrow Express Silver and Blue'
    special_tags: [operator/Heathrow Express]
  - name: 'Heathrow Express Silver and Purple'
    special_tags: [operator/Heathrow Express]
